<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120">
  <!-- Grey background -->
  <rect width="340" height="120" rx="6" fill="#7a7a7a"/>

  <!-- Black bottom rounded bar -->
  <rect x="8" y="80" width="324" height="34" rx="6" fill="#111111"/>

  <!-- POONAM text: P -->
  <text x="10" y="74" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="white" letter-spacing="-1">P</text>

  <!-- First O replaced by cyclist - positioned where first O would be (approx x=55) -->
  <!-- Cyclist silhouette in green, leaning forward on a road bike -->
  <g transform="translate(52, 4)">
    <!-- Rear wheel -->
    <circle cx="14" cy="52" r="14" fill="none" stroke="#4CAF50" stroke-width="4"/>
    <!-- Front wheel -->
    <circle cx="62" cy="52" r="14" fill="none" stroke="#4CAF50" stroke-width="4"/>
    <!-- Bottom bracket / pedal area -->
    <circle cx="38" cy="52" r="3" fill="#4CAF50"/>
    <!-- Chain stay rear -->
    <line x1="14" y1="52" x2="38" y2="52" stroke="#4CAF50" stroke-width="3.5"/>
    <!-- Seat tube -->
    <line x1="38" y1="52" x2="34" y2="28" stroke="#4CAF50" stroke-width="3.5"/>
    <!-- Down tube -->
    <line x1="62" y1="52" x2="34" y2="28" stroke="#4CAF50" stroke-width="3.5"/>
    <!-- Chain stay front (to fork) -->
    <line x1="62" y1="52" x2="56" y2="36" stroke="#4CAF50" stroke-width="3.5"/>
    <!-- Fork -->
    <line x1="56" y1="36" x2="62" y2="52" stroke="#4CAF50" stroke-width="3.5"/>
    <!-- Top tube -->
    <line x1="34" y1="28" x2="54" y2="26" stroke="#4CAF50" stroke-width="3.5"/>
    <!-- Handlebar stem -->
    <line x1="54" y1="26" x2="57" y2="34" stroke="#4CAF50" stroke-width="3"/>
    <!-- Handlebar drop -->
    <line x1="54" y1="26" x2="64" y2="28" stroke="#4CAF50" stroke-width="3"/>
    <!-- Seat -->
    <line x1="28" y1="27" x2="38" y2="27" stroke="#4CAF50" stroke-width="3"/>
    <!-- Rider head (leaning forward aggressively) -->
    <circle cx="60" cy="12" r="8" fill="#4CAF50"/>
    <!-- Rider torso (leaning very forward, racing position) -->
    <line x1="60" y1="20" x2="54" y2="28" stroke="#4CAF50" stroke-width="4"/>
    <!-- Rider lower back to seat -->
    <line x1="54" y1="28" x2="34" y2="26" stroke="#4CAF50" stroke-width="4"/>
    <!-- Rider arm reaching to handlebar -->
    <line x1="54" y1="28" x2="62" y2="28" stroke="#4CAF50" stroke-width="3.5"/>
    <!-- Rider leg down -->
    <line x1="54" y1="28" x2="46" y2="44" stroke="#4CAF50" stroke-width="3.5"/>
    <line x1="46" y1="44" x2="38" y2="52" stroke="#4CAF50" stroke-width="3"/>
    <!-- Rider leg up -->
    <line x1="54" y1="28" x2="52" y2="40" stroke="#4CAF50" stroke-width="3"/>
    <line x1="52" y1="40" x2="60" y2="46" stroke="#4CAF50" stroke-width="3"/>
  </g>

  <!-- Second O -->
  <text x="122" y="74" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="white" letter-spacing="-1">O</text>

  <!-- NAM -->
  <text x="175" y="74" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="white" letter-spacing="-1">NAM</text>

  <!-- Bottom bar text: CYCLE & TOY WORLD -->
  <text x="170" y="107" font-family="Arial Black, Arial, sans-serif" font-weight="800" font-size="18" fill="white" text-anchor="middle" letter-spacing="3">CYCLE &amp; TOY WORLD</text>
</svg>
