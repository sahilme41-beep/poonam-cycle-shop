<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="260" height="100">
  <!-- Grey background -->
  <rect width="260" height="100" rx="10" fill="#6e6e6e"/>
  <!-- Black bottom bar -->
  <rect x="0" y="68" width="260" height="32" rx="0" fill="#111111"/>
  <rect x="0" y="78" width="260" height="22" rx="0" fill="#111111"/>
  <rect x="0" y="68" width="260" height="32" fill="#111111"/>
  <!-- Rounded bottom corners matching outer rect -->
  <rect x="0" y="86" width="10" height="14" rx="0" fill="#111111"/>
  <rect x="250" y="86" width="10" height="14" rx="0" fill="#111111"/>

  <!-- P -->
  <text x="12" y="62" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="50" fill="white">P</text>

  <!-- Cyclist icon replacing first O (centered around x=72) -->
  <g transform="translate(50, 10) scale(0.85)">
    <!-- Rear wheel -->
    <circle cx="12" cy="42" r="12" fill="none" stroke="#5DBB3F" stroke-width="3.5"/>
    <!-- Front wheel -->
    <circle cx="54" cy="42" r="12" fill="none" stroke="#5DBB3F" stroke-width="3.5"/>
    <!-- Frame: chainstay -->
    <line x1="12" y1="42" x2="33" y2="42" stroke="#5DBB3F" stroke-width="3"/>
    <!-- Frame: seat tube -->
    <line x1="33" y1="42" x2="30" y2="22" stroke="#5DBB3F" stroke-width="3"/>
    <!-- Frame: top tube / down tube -->
    <line x1="30" y1="22" x2="54" y2="42" stroke="#5DBB3F" stroke-width="3"/>
    <line x1="12" y1="42" x2="30" y2="22" stroke="#5DBB3F" stroke-width="3"/>
    <!-- Handlebar -->
    <line x1="44" y1="23" x2="56" y2="21" stroke="#5DBB3F" stroke-width="3"/>
    <line x1="54" y1="30" x2="52" y2="21" stroke="#5DBB3F" stroke-width="2.5"/>
    <!-- Seat -->
    <line x1="24" y1="24" x2="33" y2="22" stroke="#5DBB3F" stroke-width="3"/>
    <!-- Rider head -->
    <circle cx="53" cy="11" r="7" fill="#5DBB3F"/>
    <!-- Rider body -->
    <line x1="53" y1="18" x2="44" y2="28" stroke="#5DBB3F" stroke-width="3"/>
    <!-- Rider arm to handlebar -->
    <line x1="44" y1="28" x2="50" y2="23" stroke="#5DBB3F" stroke-width="2.5"/>
    <!-- Rider leg 1 -->
    <line x1="44" y1="28" x2="38" y2="38" stroke="#5DBB3F" stroke-width="3"/>
    <!-- Rider leg 2 -->
    <line x1="44" y1="28" x2="48" y2="37" stroke="#5DBB3F" stroke-width="2.5"/>
  </g>

  <!-- NAM (continues after cyclist icon, approx x=110) -->
  <text x="108" y="62" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="50" fill="white">NAM</text>

  <!-- Bottom subtitle -->
  <text x="130" y="89" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="white" text-anchor="middle" letter-spacing="3">CYCLE &amp; TOY WORLD</text>
</svg>
