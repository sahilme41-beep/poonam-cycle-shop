<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140">
  <!-- Grey background - matches image exactly -->
  <rect width="420" height="140" rx="8" fill="#808080"/>

  <!-- Black bottom bar - full width, rounded only at bottom -->
  <rect x="0" y="97" width="420" height="43" fill="#1a1a1a"/>
  <rect x="0" y="97" width="420" height="10" fill="#1a1a1a"/>
  <!-- Round bottom corners only -->
  <rect x="0" y="132" width="420" height="8" rx="0" fill="#1a1a1a"/>

  <!-- "P" -->
  <text x="14" y="90" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="80" fill="white">P</text>

  <!-- Green cyclist silhouette replacing first O -->
  <!-- Positioned at ~x=68, sized to match letter height -->
  <g transform="translate(66, 8)">
    <!-- Bicycle wheels -->
    <circle cx="16" cy="63" r="16" fill="none" stroke="#4CAF50" stroke-width="4.5"/>
    <circle cx="70" cy="63" r="16" fill="none" stroke="#4CAF50" stroke-width="4.5"/>
    <!-- Frame -->
    <line x1="16" y1="63" x2="42" y2="63" stroke="#4CAF50" stroke-width="4"/>
    <line x1="42" y1="63" x2="38" y2="36" stroke="#4CAF50" stroke-width="4"/>
    <line x1="38" y1="36" x2="70" y2="63" stroke="#4CAF50" stroke-width="4"/>
    <line x1="16" y1="63" x2="38" y2="36" stroke="#4CAF50" stroke-width="4"/>
    <line x1="38" y1="36" x2="60" y2="34" stroke="#4CAF50" stroke-width="3.5"/>
    <line x1="60" y1="34" x2="70" y2="44" stroke="#4CAF50" stroke-width="3"/>
    <line x1="60" y1="34" x2="70" y2="32" stroke="#4CAF50" stroke-width="3"/>
    <!-- Seat -->
    <line x1="30" y1="36" x2="42" y2="36" stroke="#4CAF50" stroke-width="3.5"/>
    <!-- Rider - leaning forward aggressively (racing position) -->
    <!-- Head -->
    <circle cx="67" cy="14" r="9" fill="#4CAF50"/>
    <!-- Torso leaning forward -->
    <line x1="67" y1="23" x2="60" y2="34" stroke="#4CAF50" stroke-width="5"/>
    <!-- Back extending to seat -->
    <line x1="60" y1="34" x2="38" y2="34" stroke="#4CAF50" stroke-width="5"/>
    <!-- Arms to handlebar -->
    <line x1="60" y1="34" x2="70" y2="32" stroke="#4CAF50" stroke-width="4"/>
    <!-- Legs -->
    <line x1="60" y1="34" x2="50" y2="55" stroke="#4CAF50" stroke-width="4.5"/>
    <line x1="50" y1="55" x2="42" y2="63" stroke="#4CAF50" stroke-width="3.5"/>
    <line x1="60" y1="34" x2="62" y2="52" stroke="#4CAF50" stroke-width="4"/>
    <line x1="62" y1="52" x2="70" y2="58" stroke="#4CAF50" stroke-width="3.5"/>
  </g>

  <!-- Second "O" -->
  <text x="150" y="90" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="80" fill="white">O</text>

  <!-- "NAM" -->
  <text x="210" y="90" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="80" fill="white">NAM</text>

  <!-- Bottom subtitle -->
  <text x="210" y="129" font-family="Arial Black, Impact, sans-serif" font-weight="700" font-size="20" fill="white" text-anchor="middle" letter-spacing="4">CYCLE &amp; TOY WORLD</text>
</svg>
